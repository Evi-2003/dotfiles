# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# Start the frontend development windows for its Git repository.
set-hook -g session-created 'run-shell -b "~/.tmux/mijn-amsterdam-frontend.sh #{q:session_id} #{q:session_path}"'

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

# enable vi mode keys
set-window-option -g mode-keys vi

# enable extended key sequences for terminals that support it (e.g. ghostty)
set -g extended-keys on

# set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# allow focus events to get through to applications running in tmux
set -g focus-events on


# Design Tweaks
# -------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# modes
setw -g clock-mode-colour '#78a9ff'
setw -g mode-style 'fg=#161616,bg=#78a9ff,bold'

# panes
set -g pane-border-style 'fg=#262626'
set -g pane-active-border-style 'fg=#78a9ff'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#d0d0d0,bg=#161616'
set -g status-left '#[fg=#78a9ff,bold]#S#[default] '
set -g status-left-length 50

set -g status-right-style 'fg=#d0d0d0,bg=#161616'
set -g status-right '#[fg=#78a9ff]%Y-%m-%d %H:%M#[default]'

setw -g window-status-current-style 'fg=#ffffff,bg=#262626,bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#a0a0a0,bg=#161616'
setw -g window-status-separator ''
setw -g window-status-format ' #I #W #F '

setw -g window-status-bell-style 'fg=#161616,bg=#ee5396,bold'

# messages
set -g message-style 'fg=#ffffff,bg=#262626,bold'
